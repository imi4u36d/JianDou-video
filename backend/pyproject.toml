[project]
name = "jiandou-video"
version = "0.1.0"
description = "AI video generation platform on Apple Silicon"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "JianDou" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "typer>=0.15.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
    "aiofiles>=24.0.0",
    "python-multipart>=0.0.18",
    "huggingface-hub[cli]>=0.27.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.20.0",
    "ltx-2-mlx",
    "imageio[ffmpeg]>=2.36.0",
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
mlx = [
    "mlx>=0.21.0",
    "mlx-lm>=0.21.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0",
    "httpx-ws>=0.7.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[project.scripts]
jiandou = "jiandou.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jiandou"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.sources]
ltx-2-mlx = { path = "../lib/LTX-2-MLX", editable = true }
